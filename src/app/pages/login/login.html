<main class="login-page-container">

    <section class="showcase-panel">
        <div class="aurora-background">
            <div class="aurora-shape shape1"></div>
            <div class="aurora-shape shape2"></div>
            <div class="aurora-shape shape3"></div>
        </div>
        <div class="showcase-content">
            <svg class="showcase-logo" xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 2v4" />
                <path d="M16 2v4" />
                <rect width="18" height="18" x="3" y="4" rx="2" />
                <path d="M3 10h18" />
                <path d="M8 14h.01" />
                <path d="M12 14h.01" />
                <path d="M16 14h.01" />
                <path d="M8 18h.01" />
                <path d="M12 18h.01" />
                <path d="M16 18h.01" />
            </svg>
            <h1>Absence Management, Simplified.</h1>
            <p>Your portal for requesting, tracking, and managing all your leave needs.</p>
        </div>
    </section>

    <section class="form-panel">
        <div class="form-wrapper">
            <div class="form-header">
                <h2>Portal Login</h2>
                <p>Please sign in to continue.</p>
            </div>

            <form action="#" class="login-form">
                <div class="input-group">
                    <label for="email">Company Email</label>
                    <div class="input-field">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                        <input type="email" id="email" [(ngModel)]="loginObj.emailId" name="emailId" placeholder="Enter Your Email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" id="password" [(ngModel)]="loginObj.password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="form-options">
                    <a href="#" class="forgot-password">Can't log in?</a>
                </div>

                <button type="submit" (click)="login()" class="login-button">Sign In</button>

                <div class="divider">
                    <span>or sign in with</span>
                </div>

                <div class="sso-buttons">
                    <button type="button" class="sso-button">
                        <svg viewBox="0 0 48 48" width="22" height="22">
                            <path fill="#FFC107"
                                d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z">
                            </path>
                            <path fill="#FF3D00"
                                d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z">
                            </path>
                            <path fill="#4CAF50"
                                d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.222,0-9.657-3.356-11.303-8H2.479v6.981C5.908,40.13,14.494,44,24,44z">
                            </path>
                            <path fill="#1976D2"
                                d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.574l6.19,5.238C39.99,34.548,44,29.828,44,24C44,22.659,43.862,21.35,43.611,20.083z">
                            </path>
                        </svg>
                        Google
                    </button>
                    <button type="button" class="sso-button">
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <path fill="#f3f3f3"
                                d="M11.5,22.5h-9a1,1,0,0,1-1-1v-9a1,1,0,0,1,1-1h9a1,1,0,0,1,1,1v9A1,1,0,0,1,11.5,22.5Z"
                                style="fill:#f1511b"></path>
                            <path fill="#f3f3f3"
                                d="M22.5,22.5h-9a1,1,0,0,1-1-1v-9a1,1,0,0,1,1-1h9a1,1,0,0,1,1,1v9A1,1,0,0,1,22.5,22.5Z"
                                style="fill:#80cc28"></path>
                            <path fill="#f3f3f3"
                                d="M11.5,11.5h-9a1,1,0,0,1-1-1v-9a1,1,0,0,1,1-1h9a1,1,0,0,1,1,1v9A1,1,0,0,1,11.5,11.5Z"
                                style="fill:#00adef"></path>
                            <path fill="#f3f3f3"
                                d="M22.5,11.5h-9a1,1,0,0,1-1-1v-9a1,1,0,0,1,1-1h9a1,1,0,0,1,1,1v9A1,1,0,0,1,22.5,11.5Z"
                                style="fill:#fbbc09"></path>
                        </svg>
                        Microsoft
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>
