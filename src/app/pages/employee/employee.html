<div class="employee-management-container">
    <header class="page-header">
        <div class="header-content">
            <h2>Employee Management</h2>
            <p>View, add, and manage your organization's employees.</p>
        </div>
        <div class="header-actions">
            <button class="add-employee-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add Employee</span>
            </button>
        </div>
    </header>

    <div class="table-container">
        <div class="table-wrapper">
            <table class="employee-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Employee Name</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th>Contact</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- @for (item of empList; track $index) { -->
                    <tr *ngFor="let item of empList; let i = index">
                        <td>{{i+1}}</td>
                        <td>
                            <div class="user-cell">
                                <img src="https://i.pravatar.cc/40?u=a042581f4e29026704e" alt="Avatar"
                                    class="user-avatar" />
                                <div class="user-details">
                                    <span class="user-name">{{ item.employeeName }}</span>
                                    <span class="user-email">{{item.emailId}}</span>
                                </div>
                            </div>
                        </td>
                        <td>{{item.deptName}}</td>
                        <td>{{item.role}}</td>
                        <td>{{item.contactNo}}</td>
                        <td>
                            <span class="status-badge status-active">Active</span>
                        </td>
                        <td>
                            <div class="actions-cell">
                                <button class="action-button" aria-label="Edit"><svg xmlns="http://www.w3.org/2000/svg"
                                        width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                    </svg></button>
                                <button class="action-button" aria-label="Delete"><svg
                                        xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path
                                            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                        </path>
                                        <line x1="10" y1="11" x2="10" y2="17"></line>
                                        <line x1="14" y1="11" x2="14" y2="17"></line>
                                    </svg></button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
